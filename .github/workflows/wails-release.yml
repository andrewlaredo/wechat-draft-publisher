name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop App (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            goos: windows
            goarch: amd64
            build-args: -platform windows/amd64 -nsis

          - name: macOS (Universal)
            os: macos-latest
            goos: darwin
            goarch: universal
            build-args: -platform darwin/universal

          - name: Linux (x64)
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            build-args: -platform linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Sync App Icons
        run: node scripts/sync-icons.js

      - name: Build Desktop Application
        run: wails build ${{ matrix.platform.build-args }}

      # Package into clean archives for release
      - name: Package Windows Artifacts
        if: matrix.platform.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item "build/bin/*.exe" -Destination "dist-release/"
          Get-ChildItem -Path "dist-release"

      - name: Package macOS Artifacts
        if: matrix.platform.goos == 'darwin'
        run: |
          mkdir -p dist-release
          cd build/bin
          tar -czvf "../../dist-release/wechat-draft-publisher-darwin-universal.tar.gz" *.app
          cd ../..

      - name: Package Linux Artifacts
        if: matrix.platform.goos == 'linux'
        run: |
          mkdir -p dist-release
          cd build/bin
          tar -czvf "../../dist-release/wechat-draft-publisher-linux-amd64.tar.gz" *
          cd ../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wechat-draft-publisher-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}
          path: dist-release/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
